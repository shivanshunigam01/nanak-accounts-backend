<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nanak Newsletter Signup</title>
<style id="nnl-styles">
  html,body{margin:0;padding:0;background:transparent;height:auto!important;min-height:0!important;overflow:hidden;width:100%}
  body{font-family:'Segoe UI',-apple-system,Roboto,Arial,sans-serif;color:#22252A;font-size:16px;-webkit-text-size-adjust:100%}
  .nnl{--o:#F26B21;--od:#D9550E;--navy:#1B2A4A;--grey:#6B7280;--line:#E5E7EB;
    font-family:inherit;max-width:100%;width:100%;padding:0;display:block;box-sizing:border-box}
  .nnl *{box-sizing:border-box;margin:0;padding:0}
  .nnl-title{font-size:18px;font-weight:800;color:var(--navy);line-height:1.25}
  .nnl-sub{font-size:13.5px;color:#374151;margin-top:6px;line-height:1.4}
  .nnl-row{display:flex;gap:8px;margin-top:12px;align-items:stretch}
  .nnl-field{flex:1;min-width:0;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-size:16px;font-family:inherit;outline:none;background:#fff;color:#22252A;
    line-height:1.3;-webkit-appearance:none;appearance:none}
  .nnl-field::placeholder{color:#9CA3AF}
  .nnl-field:focus{border-color:var(--o)}
  .nnl-btn{background:var(--o);color:#fff;border:none;cursor:pointer;padding:11px 20px;border-radius:10px;
    font-size:14.5px;font-weight:700;font-family:inherit;white-space:nowrap;transition:background .15s;
    flex:0 0 auto;min-height:44px}
  .nnl-btn:hover{background:var(--od)}
  .nnl-btn:disabled{opacity:.6;cursor:default}
  .nnl-note{font-size:11px;color:var(--grey);margin-top:8px;line-height:1.35}
  .nnl-note.err{color:#DC2626}
  .nnl-done{display:none;align-items:flex-start;gap:10px;margin-top:10px;
    background:#E8F4EE;border:1px solid #BFE0CE;border-radius:10px;padding:12px 14px}
  .nnl-done.on{display:flex}
  .nnl-done .tick{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:#0E7C4A;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px}
  .nnl-done b{display:block;font-size:13.5px;color:var(--navy)}
  .nnl-done span{font-size:12px;color:var(--grey);line-height:1.35}
  .nnl-hp{position:absolute;left:-9999px;opacity:0;height:0;width:0;overflow:hidden}
  .nnl-btn:focus-visible,.nnl-field:focus-visible{outline:3px solid rgba(242,107,33,.4);outline-offset:2px}

  @media(max-width:520px){
    .nnl-title{font-size:17px}
    .nnl-sub{font-size:13px}
    .nnl-row{flex-direction:column;gap:8px}
    .nnl-btn{width:100%;padding:12px 16px}
    .nnl-field{width:100%}
  }
</style>
</head>
<body>
<div class="nnl" id="nnl">
  <div class="nnl-title">Subscribe to our newsletter</div>
  <div class="nnl-sub">Get tax tips, business insights, and updates delivered to your inbox.</div>

  <div id="nnl-form">
    <div class="nnl-row">
      <input class="nnl-field" id="nnl-email" type="email" placeholder="Enter your email" autocomplete="email" inputmode="email" enterkeyhint="send">
      <button class="nnl-btn" id="nnl-btn" type="button">Subscribe</button>
    </div>
    <input class="nnl-hp" id="nnl-website" type="text" name="company_website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="nnl-note" id="nnl-note">Tax tips and updates from our accountants. Unsubscribe anytime.</div>
  </div>

  <div class="nnl-done" id="nnl-done">
    <div class="tick">&#10003;</div>
    <div>
      <b>You're subscribed</b>
      <span>Look out for our next update. Nothing else to do.</span>
    </div>
  </div>
</div>

<script>
(function(){
  var API_BASE = (function () {
    try {
      var h = location.hostname || '';
      if (h.indexOf('connect.cavaluer.com') !== -1 || h === 'localhost' || h === '127.0.0.1') {
        return '';
      }
    } catch (e) {}
    return 'https://api.connect.cavaluer.com';
  })();

  function contentHeight(){
    var el = document.getElementById('nnl');
    if (!el) return 0;
    // Measure the widget only — never document/viewport scrollHeight (that caused footer blank space).
    var r = el.getBoundingClientRect();
    return Math.ceil(Math.max(r.height, el.offsetHeight, el.scrollHeight)) + 2;
  }

  function applyParentFrame(h){
    try {
      var frames = window.parent.document.querySelectorAll('iframe');
      frames.forEach(function(frame){
        try {
          if (frame.contentWindow === window) {
            frame.style.height = h + 'px';
            frame.removeAttribute('height');
            frame.setAttribute('scrolling', 'no');
          }
        } catch (_) {}
      });
    } catch (_) {}
  }

  function postHeight(){
    try {
      var h = contentHeight();
      if (!h || h < 40) return;
      applyParentFrame(h);
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'nanak-embed-resize', height: h, source: 'newsletter' }, '*');
        window.parent.postMessage({ type: 'resize-iframe', height: h }, '*');
      }
    } catch (e) {}
  }

  function submitSubscriber(payload){
    return fetch(API_BASE + '/api/newsletter-subscribers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).then(function(res){
      return res.json().then(function(body){
        if(!res.ok || body.success === false){
          throw new Error((body && body.message) || 'Submission failed');
        }
        return body;
      });
    });
  }

  function parentPage(){
    try {
      if (document.referrer) {
        return new URL(document.referrer).pathname || '/';
      }
    } catch (e) {}
    return location.pathname || '/';
  }

  var email = document.getElementById('nnl-email');
  var btn   = document.getElementById('nnl-btn');
  var note  = document.getElementById('nnl-note');
  var hp    = document.getElementById('nnl-website');

  function go(){
    var v = email.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){
      note.textContent = 'Enter a valid email address.';
      note.classList.add('err');
      email.focus();
      postHeight();
      return;
    }
    note.classList.remove('err');
    note.textContent = 'Tax tips and updates from our accountants. Unsubscribe anytime.';
    btn.disabled = true; btn.textContent = 'Subscribing...';

    var payload = {
      lead:{
        email: v,
        mobile: null,
        record_type: 'subscriber',
        status: 'new',
        service_interest: null,
        lead_score: 20,
        marketing_optin: true,
        consent: { email_marketing: 'newsletter_v1' },
        company_website: (hp && hp.value) || ''
      },
      touchpoint:{
        channel: 'website_footer',
        source: 'newsletter_signup',
        page: parentPage(),
        article_title: null,
        captured_at: new Date().toISOString()
      }
    };

    submitSubscriber(payload).then(function(){
      document.getElementById('nnl-form').style.display = 'none';
      document.getElementById('nnl-done').classList.add('on');
      postHeight();
    }).catch(function(){
      btn.disabled = false; btn.textContent = 'Subscribe';
      note.textContent = 'That didn\'t go through. Try again, or email info@nanakaccountants.com.au';
      note.classList.add('err');
      postHeight();
    });
  }

  btn.addEventListener('click', go);
  email.addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });

  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(function(){ postHeight(); }).observe(document.getElementById('nnl'));
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  postHeight();
  requestAnimationFrame(postHeight);
  setTimeout(postHeight, 50);
  setTimeout(postHeight, 200);
})();
</script>
</body>
</html>
